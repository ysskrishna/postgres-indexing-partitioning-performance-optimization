services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=service_user
      - POSTGRES_PASSWORD=service_password
      - POSTGRES_DB=master_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_user -d master_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data: